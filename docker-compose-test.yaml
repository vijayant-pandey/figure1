  figure1:
    build:
      context: .
    env_file:
      - ./.env
    command: python figure1/run/flask_startup.py
    ports:
      - "30000:30000"

  celery:
    build:
      context: .
    command: celery -A figure1.core.celery_app worker --loglevel=info
    environment:
      DATABASE_DSN: "postgresql://figure1_admin:test1234@postgres:5432/figure1_test"
      REDIS_URL: redis://redis:6379
      FIRESTORE_EMULATOR_HOST: firestore:8200
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERS_ALIAS: test_users
      ELASTICSEARCH_CASES_ALIAS: test_cases
      TEST_MODE: "true"
    depends_on:
      - figure1
      - redis

  flower:
    build:
      context: .
    command: celery -A figure1.core.celery_app flower --port=5555 --conf=flowerconfig.py
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - celery
