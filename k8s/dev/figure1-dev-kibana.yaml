

apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app: kibana
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: kibana
      nodePort: 30051
  selector:
    app: kibana

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: kibana
data:
  kibana.yml: |
    elasticsearch.requestTimeout: 180000
    elasticsearch.hosts: "http://elasticsearch:9200"
    server.host: "0"

---
kind: Deployment
apiVersion: apps/v1 
metadata:
  name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      volumes:
        - name: kibana-config
          configMap:
            name: kibana
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:7.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch:9200
          ports:
            - containerPort: 5601
              name: kibana
          volumeMounts:
            - name: kibana-config
              mountPath: /usr/share/kibana/config
          readinessProbe:
            httpGet:
              path: /status
              port: kibana
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: kibana
            initialDelaySeconds: 60
            periodSeconds: 60
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 786Mi
