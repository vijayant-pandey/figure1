steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'install-jq'
    entrypoint: bash
    args:
      - -ceu
      - |
        set -Eeuo pipefail
        # Install jq on-the-fly (works on Debian/Alpine/CentOS bases)
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y && apt-get install -y jq
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq
          elif command -v yum >/dev/null 2>&1; then
            yum install -y jq
          else
            echo "jq not found and no known package manager available" >&2
            exit 2
          fi
        fi

        # Run your script
        bash generate-local-env.sh

  - name: 'gcr.io/cloud-builders/docker:latest'
    id: 'build-docker-image'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/bitbucket/${_SERVICE_NAME}:latest', '.' ]

  - name: 'gcr.io/cloud-builders/docker:latest'
    id: 'push-image'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/bitbucket/${_SERVICE_NAME}:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-with-dynamic-env'
    entrypoint: 'bash'
    args:
      - -c
      - |
        # Fetch secret contents from Secret Manager
        SECRET_JSON=$(gcloud secrets versions access latest --secret=services-api-env)

        # Convert multi-line KEY=VALUE format into comma-separated string for --set-env-vars
        # ENV_VARS=$(echo "$$SECRET_JSON" | xargs | sed 's/ /,/g')

        # echo "Deploying with env vars: $$ENV_VARS"
        echo "$$SECRET_JSON" > env-vars.json

        gcloud run deploy figure1-api-services-be-tf \
          --region=us-central1 \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/bitbucket/${_SERVICE_NAME}:latest \
          --port=30000 \
          --allow-unauthenticated \
          --cpu=2000m \
          --memory=8192Mi \
          --timeout=300s \
          --min-instances=1 \
          --max-instances=3 \
          --command=/app/entrypoint.sh \
          --env-vars-file=env-vars.json

  # Updates container env variables and Shutdown/Restarts Celery Beat & Worker VMs
  - name: 'gcr.io/cloud-builders/gcloud:latest'
    id: 'update-container'
    entrypoint: bash
    args:
      - -c
      - |
        echo "Updating containers"        
        
        gcloud compute instances update-container ${_CELERY_WORKER_VM_INSTANCE} --zone ${_ZONE} \
        --container-env-file=.env.runtime || exit 1      
        
        gcloud compute instances update-container ${_CELERY_BEAT_VM_INSTANCE} --zone ${_ZONE} \
        --container-env-file=.env.runtime || exit 1          

options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: 'projects/$PROJECT_ID/locations/${_WORKER_ZONE}/workerPools/${_WORKER_NAME}'